<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MahjHero — Your club's table, always set.</title>
<meta name="description" content="MahjHero is the seat-by-seat scheduler for American Mahjong clubs and private games — book with friends, an auto-promoting waitlist, on-arrival check-in, and a club leaderboard." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #f5ead8;
    --surface: #ebddc5;
    --text: #201e1d;
    --text-muted: #676158;
    --text-label: #605b55;
    --accent: #c67139;
    --accent-100: #fff2eb;
    --accent-200: #ffe1d0;
    --accent-300: #ffc6a5;
    --accent-700: #8c491a;
    --accent-800: #643312;
    --accent2: #7a8a5e;
    --accent2-100: #f0fae1;
    --accent2-200: #e1eecc;
    --accent2-600: #728157;
    --accent2-700: #56633f;
    --accent2-800: #3d472b;
    --neutral-200: #eee7db;
    --neutral-300: #dcd3c4;
    --neutral-900: #2e2b25;
    --divider: rgba(32, 30, 29, 0.16);
    --radius-sm: 8px;
    --radius-md: 16px;
    --radius-lg: 28px;
    --radius-card: 32px;
    --radius-pill: 999px;
    --shadow-sm: 0 1px 2px rgba(46, 43, 37, 0.14);
    --shadow-md: 0 3px 10px rgba(46, 43, 37, 0.16);
    --shadow-lg: 0 12px 32px rgba(46, 43, 37, 0.22);
    --font-heading: 'Caprasimo', Georgia, serif;
    --font-body: 'Figtree', -apple-system, sans-serif;
  }

  * { box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    font-size: 18px;
    line-height: 1.6;
  }

  img, svg { max-width: 100%; display: block; }

  .wrap {
    max-width: 960px;
    margin: 0 auto;
    padding: 0 26px;
  }

  section { padding: 70px 0; }

  h1, h2, h3 {
    font-family: var(--font-heading);
    font-weight: 400;
    color: var(--text);
    margin: 0;
  }

  p { margin: 0; }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-body);
    font-weight: 700;
    font-size: 18px;
    padding: 16px 32px;
    border-radius: var(--radius-pill);
    text-decoration: none;
    cursor: pointer;
    border: none;
  }

  .btn-primary {
    background: var(--accent);
    color: var(--accent-100);
    box-shadow: var(--shadow-md);
  }

  .btn-secondary {
    background: transparent;
    color: var(--text);
    border: 1px solid var(--divider);
  }

  .card {
    background: var(--surface);
    border-radius: var(--radius-card);
    padding: 26px;
    box-shadow: var(--shadow-sm);
  }

  /* HERO_STYLES */

  /* PROBLEM_STYLES */

  /* ROLE_PICKER_STYLES */

  /* FEATURES_STYLES */

  /* FOUNDER_STYLES */

  /* FINAL_CTA_STYLES */

  /* FOOTER_STYLES */
</style>
</head>
<body>

  <!-- PROBLEM -->
  <!-- ROLE_PICKER -->
  <!-- FEATURES -->
  <!-- FOUNDER -->
  <!-- FINAL_CTA -->
  <!-- FOOTER -->

</body>
</html>
